# Copy to config.yaml and fill in real model identifiers.
# Model ids drift over time - check current docs before filling these in,
# the values below are placeholders, not a recommendation.
backends:
  claude:
    enabled: true
    model: "REPLACE_ME"  # e.g. a current Claude model id from Anthropic's docs
  gpt:
    enabled: false
    model: "REPLACE_ME"
  gemini:
    enabled: false
    model: "REPLACE_ME"
  ollama:
    enabled: false
    model: "REPLACE_ME"  # a model tag already pulled into the ollama container

tools:
  # Adds the isabelle/agent services and routes webui through the agent
  # instead of straight to llm-gateway - see isabelle/README.md and
  # README.md "Enabling the Isabelle proof-checking tool" before setting
  # this true.
  isabelle: {enabled: false}
  afp_search: {enabled: false}  # not implemented yet, has no effect
  web_search: {enabled: false}  # not implemented yet, has no effect

auth:
  mode: single_user
  whitelist: []

# Pinned upstream image tags - reproducibility over always-latest. Bump
# these deliberately (check the project's releases first); swap in a
# floating tag like "ghcr.io/berriai/litellm:main-stable" instead if you'd
# rather always get the newest build.
images:
  webui: ghcr.io/open-webui/open-webui:v0.12.2
  litellm: ghcr.io/berriai/litellm:v1.105.1
  ollama: ollama/ollama:0.40.4
