[project]
name = "ai-math-container"
version = "0.1.0"
description = "Config-driven builder for the Isabelle proof agent container stack"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires Docker/Podman and a pre-built isabelle-afp image",
]
